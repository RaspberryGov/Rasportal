<!-- TronWeb Smart Contract Integration Script -->
    <script>
        const CONTRACT_ADDRESS = 'TZ13azHANciPGgc5ukCzEJeNVZUZTzQW4N';
        let tronContract = null;
        let userAddress = null;

        // Initialize TronLink connection and load data
        window.addEventListener('load', async () => {
            let attempts = 0;
            const maxAttempts = 15;

            const checkInterval = setInterval(async () => {
                attempts++;
                if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                    clearInterval(checkInterval);
                    window.tronWebReady = true;
                    userAddress = window.tronWeb.defaultAddress.base58;
                    document.getElementById('wallet-status').innerText = userAddress.substring(0, 6) + '...' + userAddress.substring(userAddress.length - 4);
                    
                    try {
                        // Instantiate the contract instance on Nile Testnet
                        tronContract = await window.tronWeb.contract().at(CONTRACT_ADDRESS);
                        console.log("Smart contract loaded successfully:", tronContract);
                        
                        // Enable buttons once connected
                        document.getElementById('stake-btn').removeAttribute('disabled');
                        document.getElementById('unstake-btn').removeAttribute('disabled');
                        document.getElementById('withdraw-btn').removeAttribute('disabled');

                        // Fetch dynamic user metrics & contract metrics
                        refreshDashboardData();
                    } catch (err) {
                        console.error("Failed to attach contract ABI/instance:", err);
                        document.getElementById('wallet-status').innerText = 'Contract Error';
                    }
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    document.getElementById('wallet-status').innerText = 'TronLink Not Found';
                    alert('Please install TronLink and log in to the Nile Testnet.');
                }
            }, 1000);
        });

        // Fetch balances and pending accrued interest/dividends from contract
        async function refreshDashboardData() {
            if (!tronContract || !userAddress) return;
            try {
                // 1. Query accrued dividends / pending interest
                if (typeof tronContract.getPendingInterest === 'function') {
                    const interest = await tronContract.getPendingInterest(userAddress).call();
                    document.getElementById('dividend-amount').value = (window.tronWeb.fromSun(interest.toString())) + ' $ETF';
                } else if (typeof tronContract.pendingDividends === 'function') {
                    const dividends = await tronContract.pendingDividends(userAddress).call();
                    document.getElementById('dividend-amount').value = (window.tronWeb.fromSun(dividends.toString())) + ' $ETF';
                }

                // 2. Query strictly the STAKED balance (avoiding wallet balance function fallbacks like balanceOf)
                let stakedFound = false;
                const stakedFunctionNames = ['getStakedBalance', 'stakedBalanceOf', 'stakedOf', 'stakingBalance', 'getUserStaked'];
                
                for (let funcName of stakedFunctionNames) {
                    if (typeof tronContract[funcName] === 'function') {
                        const staked = await tronContract[funcName](userAddress).call();
                        document.getElementById('staked-balance').innerText = (window.tronWeb.fromSun(staked.toString())) + ' $ETF';
                        stakedFound = true;
                        break;
                    }
                }

                if (!stakedFound) {
                    document.getElementById('staked-balance').innerText = 'Function Missing';
                }

                // 3. Query total token supply if available
                if (typeof tronContract.totalSupply === 'function') {
                    const supply = await tronContract.totalSupply().call();
                    document.getElementById('token-supply').innerText = Number(window.tronWeb.fromSun(supply.toString())).toLocaleString() + ' ETF';
                }
            } catch (e) {
                console.warn("Error fetching live metrics from contract methods:", e);
            }
        }

        // 1. Stake Function Integration
        async function handleStake() {
            const amount = document.getElementById('stake-amount').value;
            if (!amount || amount <= 0) {
                alert('Please enter a valid amount to stake.');
                return;
            }

            if (!tronContract) {
                alert('Smart contract not connected yet.');
                return;
            }

            try {
                document.getElementById('stake-btn').innerText = 'Staking...';
                const amountInSun = window.tronWeb.toSun(amount);

                await tronContract.stake(amountInSun).send({
                    feeLimit: 100_000_000
                });

                alert('Stake transaction submitted successfully!');
                document.getElementById('stake-amount').value = '';
                refreshDashboardData();
            } catch (error) {
                console.error('Stake error:', error);
                alert('Staking failed. Check console for details.');
            } finally {
                document.getElementById('stake-btn').innerText = 'Stake';
            }
        }

        // 2. Unstake Function Integration
        async function handleUnstake() {
            const amount = document.getElementById('stake-amount').value;
            if (!amount || amount <= 0) {
                alert('Please enter a valid amount to unstake.');
                return;
            }

            if (!tronContract) {
                alert('Smart contract not connected yet.');
                return;
            }

            try {
                document.getElementById('unstake-btn').innerText = 'Unstaking...';
                const amountInSun = window.tronWeb.toSun(amount);

                await tronContract.unstake(amountInSun).send({
                    feeLimit: 100_000_000
                });

                alert('Unstake transaction submitted successfully!');
                document.getElementById('stake-amount').value = '';
                refreshDashboardData();
            } catch (error) {
                console.error('Unstake error:', error);
                alert('Unstaking failed. Check console for details.');
            } finally {
                document.getElementById('unstake-btn').innerText = 'Unstake';
            }
        }

        // 3. Withdraw Dividends / Accrued Interest Function Integration
        async function handleWithdrawDividends() {
            if (!tronContract) {
                alert('Smart contract not connected yet.');
                return;
            }

            try {
                document.getElementById('withdraw-btn').innerText = 'Withdrawing...';

                if (typeof tronContract.withdraw === 'function') {
                    await tronContract.withdraw().send({ feeLimit: 100_000_000 });
                } else if (typeof tronContract.claimDividends === 'function') {
                    await tronContract.claimDividends().send({ feeLimit: 100_000_000 });
                } else {
                    await tronContract.withdrawDividends().send({ feeLimit: 100_000_000 });
                }

                alert('Dividend withdrawal transaction submitted successfully!');
                refreshDashboardData();
            } catch (error) {
                console.error('Withdrawal error:', error);
                alert('Withdrawal failed. Check console for details.');
            } finally {
                document.getElementById('withdraw-btn').innerText = 'Withdraw Dividends';
            }
        }
    </script>
